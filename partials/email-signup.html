<section class="signup-banner" aria-label="Email signup">
  <div class="signup-banner__inner">
    <div class="signup-banner__copy">
      <p class="signup-banner__text"><strong>Get the next shortlist-worthy comparison.</strong> New picks only, no filler.</p>
    </div>
    <div>
      <form class="signup-banner__form" action="https://api.web3forms.com/submit" method="POST" data-signup-form>
        <input type="hidden" name="access_key" value="9c66ac91-e04a-46bf-a9b7-39cef266557b">
        <input type="hidden" name="subject" value="New Worth Adding email signup">
        <input type="hidden" name="from_name" value="Worth Adding">
        <input type="hidden" name="Signup Source" value="Global banner">
        <input class="signup-banner__botcheck" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" style="display: none;">
        <label class="signup-banner__label" for="global-email-signup">Email address</label>
        <input class="signup-banner__input" id="global-email-signup" type="email" name="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
        <button class="signup-banner__button" type="submit">Email me</button>
      </form>
      <p class="signup-banner__status" aria-live="polite" data-signup-status></p>
    </div>
  </div>
</section>
<script>
  (function () {
    const form = document.querySelector('[data-signup-form]');
    const status = document.querySelector('[data-signup-status]');
    if (!form || !status || !window.fetch) return;

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      const button = form.querySelector('button[type="submit"]');
      const formData = new FormData(form);

      status.dataset.state = '';
      status.textContent = 'Sending...';
      if (button) button.disabled = true;

      try {
        const response = await fetch(form.action, {
          method: 'POST',
          headers: {
            Accept: 'application/json'
          },
          body: formData
        });
        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.message || 'Signup failed.');
        }

        form.reset();
        status.dataset.state = 'success';
        status.textContent = 'You are on the test list. Thank you.';
      } catch (error) {
        status.dataset.state = 'error';
        status.textContent = 'That did not send. Please try once more.';
      } finally {
        if (button) button.disabled = false;
      }
    });
  })();
</script>
