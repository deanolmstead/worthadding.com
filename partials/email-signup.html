<section class="signup-banner" aria-label="Email signup" data-signup-block>
  <div class="signup-banner__inner">
    <div class="signup-banner__copy">
      <p class="signup-banner__text"><strong>We compare. You choose.</strong> Fresh picks, straight to your inbox.</p>
    </div>
    <div>
      <form class="signup-banner__form" action="https://api.web3forms.com/submit" method="POST" data-signup-form>
        <input type="hidden" name="access_key" value="9c66ac91-e04a-46bf-a9b7-39cef266557b">
        <input type="hidden" name="subject" value="New Worth Adding email signup">
        <input type="hidden" name="from_name" value="Worth Adding">
        <input type="hidden" name="Signup Source" value="Global banner">
        <input class="signup-banner__botcheck" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" style="display: none;">
        <input class="signup-banner__input" type="email" name="email" inputmode="email" autocomplete="email" placeholder="you@example.com" aria-label="Email address" required>
        <button class="signup-banner__button" type="submit">Sign me up</button>
      </form>
      <p class="signup-banner__status" aria-live="polite" data-signup-status></p>
    </div>
  </div>
</section>
<script>
  (function () {
    if (!window.fetch) return;

    document.querySelectorAll('[data-signup-block]').forEach(function (block) {
      const form = block.querySelector('[data-signup-form]');
      const status = block.querySelector('[data-signup-status]');
      if (!form || !status || form.dataset.signupBound) return;

      form.dataset.signupBound = 'true';

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        const button = form.querySelector('button[type="submit"]');
        const formData = new FormData(form);

        status.dataset.state = '';
        status.textContent = 'Sending...';
        if (button) button.disabled = true;

        try {
          const response = await fetch(form.action, {
            method: 'POST',
            headers: {
              Accept: 'application/json'
            },
            body: formData
          });
          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error(result.message || 'Signup failed.');
          }

          form.reset();
          status.dataset.state = 'success';
          status.textContent = 'You are on the list. We will send the next Worth Adding picks soon.';
        } catch (error) {
          status.dataset.state = 'error';
          status.textContent = 'That did not send. Please try once more.';
        } finally {
          if (button) button.disabled = false;
        }
      });
    });
  })();
</script>
